openapi: 3.1.0
info:
  title: Ingredient OAS
  description: Ingredient OAS
  version: 1.0.0
servers:
  - url: 'https//localhost:8080'

tags:
  - name: Ingredients
  - name: Dishes

paths:
  /ingredients:
    get:
      tags:
        - Ingredients
      description: Return list of ingredients
      responses:
        '200':
          description: List of ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'

  /ingredients/{id}:
    get:
      tags:
        - Ingredients
      parameters:
        - $ref: '#/components/parameters/IdParam'
      description: Return an ingredient with id as parameter
      responses:
        '200':
          description: Ingredient with his id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '404':
          $ref: '#/components/responses/IngredientNotFound'


components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    IngredientNotFound:
      description: Ingredient not found
      content:
        text/plain:
          schema:
            type: string
            example: "Ingredient.id=4 is not found"

  schemas:
    CategoryEnum:
      type: string
      enum:
        - VEGETABLE
        - ANIMAL
        - MARINE
        - DAIRY
        - OTHER
      example: ANIMAL

    DishTypeEnum:
      type: string
      enum:
        - START
        - MAIN
        - STARTER
        - DESSERT
      example: STARTER
    UnitType:
      type: string
      enum:
        - KG
        - PCS
        - L
      example: KG

    Ingredient:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: poulet
        category:
          $ref: '#/components/schemas/CategoryEnum'
        price:
          type: number
          format: double
          example: 9.2





  
